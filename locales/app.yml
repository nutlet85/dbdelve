# —— 设置页：行标题与描述 ——
settings.row.row_limit.title:                 { en: "Row limit", zh-CN: "行数上限" }
settings.row.row_limit.description:           { en: "The most rows a new tab keeps from one statement. Tabs already open keep theirs.", zh-CN: "一个新标签页从单条语句保留的最多行数。已打开的标签页保持各自的上限。" }
settings.row.default_sorting.title:           { en: "Default sorting", zh-CN: "默认排序" }
settings.row.default_sorting.description:     { en: "How a new tab sorts on a header click: Server asks the database again, Client reorders only the rows already loaded. Tabs already open keep theirs.", zh-CN: "新标签页点击表头时如何排序：服务器让数据库重新排序，客户端只重排已加载的行。已打开的标签页保持各自的设置。" }
settings.row.language.title:                  { en: "Language", zh-CN: "语言" }
settings.row.language.description:            { en: "Interface language; takes effect immediately.", zh-CN: "界面语言；立即生效。" }
settings.row.alias_completions.title:         { en: "Alias tables and suggest JOIN conditions", zh-CN: "表名带别名，并提示 JOIN 条件" }
settings.row.alias_completions.description:   { en: "Completing a table name after FROM or JOIN adds a short alias; where a foreign key links it to a table already in the statement, the ON condition it would write is offered too.", zh-CN: "在 FROM 或 JOIN 后补全表名时附带简短别名；若该表与语句中已有的表存在外键，还会一并给出可写入的 ON 条件。" }
settings.row.format_keyword_case.title:       { en: "Keyword case", zh-CN: "关键字大小写" }
settings.row.format_keyword_case.description: { en: "The case Format Query writes keywords in; everything else is left as typed.", zh-CN: "格式化查询书写关键字时使用的大小写；其余内容保持原样。" }
settings.row.format_function_case.title:       { en: "Function case", zh-CN: "函数名大小写" }
settings.row.format_function_case.description: { en: "The case Format Query writes function names in; everything else is left as typed.", zh-CN: "格式化查询书写函数名时使用的大小写；其余内容保持原样。" }
settings.row.format_type_case.title:           { en: "Data type case", zh-CN: "数据类型大小写" }
settings.row.format_type_case.description:     { en: "The case Format Query writes type names in, as in CAST(x AS int) or a column definition.", zh-CN: "格式化查询书写类型名时使用的大小写，例如 CAST(x AS int) 或列定义。" }
settings.row.format_logical_operators.title:   { en: "AND/OR position", zh-CN: "AND/OR 位置" }
settings.row.format_logical_operators.description: { en: "Where a broken line's AND or OR sits: at the start of the next line, or at the end of the line before it. A line comment on the previous line keeps the operator at the start.", zh-CN: "换行后的 AND 或 OR 放在下一行行首，还是上一行行尾。上一行有行注释时仍放在行首。" }
settings.row.format_indent.title:             { en: "Indent", zh-CN: "缩进" }
settings.row.format_indent.description:       { en: "The indentation Format Query uses for each level: two spaces, four spaces, or a tab.", zh-CN: "格式化查询每一级使用的缩进：两个空格、四个空格或一个制表符。" }
settings.row.format_expression_width.title:       { en: "Expression width", zh-CN: "表达式宽度" }
settings.row.format_expression_width.description: { en: "The longest parenthesized expression, in characters, Format Query keeps on one line; longer ones are split.", zh-CN: "括号表达式不超过这个字符数时保持一行，超过则拆分。" }
settings.row.format_compact_clauses.title:       { en: "Compact clauses", zh-CN: "紧凑子句" }
settings.row.format_compact_clauses.description: { en: "Keeps a comma-separated clause on one line when it is no longer than the chosen width; otherwise every item gets its own line.", zh-CN: "子句长度不超过所选字符数时，逗号分隔的内容保持一行；否则每项单独一行。" }
settings.row.format_joins.title:              { en: "JOIN on its own line", zh-CN: "JOIN 独立成行" }
settings.row.format_joins.description:        { en: "Format Query starts each JOIN on a new line at the FROM level instead of indenting it under the first table.", zh-CN: "格式化查询让每个 JOIN 在 FROM 层级新起一行，而不是缩进在第一个表下面。" }
settings.row.run_unreadable.title:            { en: "Run statements DBDelve can't parse", zh-CN: "执行 DBDelve 无法解析的语句" }
settings.row.run_unreadable.description:      { en: "Runs a statement DBDelve can't parse without asking first; such a statement can read, write or drop anything.", zh-CN: "不先询问就执行 DBDelve 无法解析的语句；这类语句可能读、写或删除任何数据。" }
settings.row.qualify_completions.title:       { en: "Qualify table names", zh-CN: "表名带模式" }
settings.row.qualify_completions.description: { en: "Completing a table name inserts it with its schema, as schema.table.", zh-CN: "补全表名时连同模式一起插入，形如 schema.table。" }
settings.row.check_for_updates.title:         { en: "Check for updates", zh-CN: "检查更新" }
settings.row.check_for_updates.description:   { en: "Asks the update source for a newer release.", zh-CN: "向更新源查询是否有新版本。" }
settings.row.update_interval.title:           { en: "Check interval", zh-CN: "检查间隔" }
settings.row.update_interval.description:     { en: "How often to check again.", zh-CN: "多久再查一次。" }
settings.row.update_feed.title:               { en: "Update source", zh-CN: "更新源" }
settings.row.update_feed.description:         { en: "Leave empty for GitHub's own releases; a mirror or proxy serving the same JSON goes here. Downloads are still checked against the release signature.", zh-CN: "留空使用 GitHub 官方发布；可填返回同样 JSON 的镜像或代理地址。下载内容仍会校验发行签名。" }
settings.row.update_feed.placeholder:         { en: "Empty for GitHub", zh-CN: "留空使用 GitHub 官方地址" }
settings.row.update_proxy.title:              { en: "Download proxy", zh-CN: "下载代理" }
settings.row.update_proxy.description:        { en: "A prefix such as https://ghfast.top, or empty to download from GitHub directly. Only github.com download addresses are rewritten; signatures are still checked.", zh-CN: "如 https://ghfast.top 的前缀；留空直连 GitHub。只改写 github.com 的下载地址，签名仍会校验。" }
settings.row.update_proxy.placeholder:        { en: "Empty for a direct download", zh-CN: "留空直连" }
settings.row.verbose_logging.title:           { en: "Verbose logging", zh-CN: "详细日志" }
settings.row.verbose_logging.description:     { en: "From the moment it is switched on, the log also holds hostnames, database names, connection errors and the drivers' own unfiltered messages.", zh-CN: "开启那一刻起，日志还会记录主机名、数据库名、连接错误以及驱动自身未过滤的消息。" }
settings.row.match_system_appearance.title:   { en: "Match system appearance", zh-CN: "跟随系统外观" }
settings.row.match_system_appearance.description: { en: "Switch themes when the system turns light or dark.", zh-CN: "系统切换浅色或深色时切换主题。" }
settings.row.theme.title:                     { en: "Theme", zh-CN: "主题" }
settings.row.theme.description:               { en: "Moving through the list previews each theme.", zh-CN: "在列表中移动时会预览各个主题。" }
settings.row.dark_theme.title:                { en: "Dark theme", zh-CN: "深色主题" }
settings.row.dark_theme.description:          { en: "Used while the system is dark.", zh-CN: "系统处于深色时使用。" }
settings.row.light_theme.title:               { en: "Light theme", zh-CN: "浅色主题" }
settings.row.light_theme.description:         { en: "Used while the system is light.", zh-CN: "系统处于浅色时使用。" }
settings.row.opacity.title:                   { en: "Opacity", zh-CN: "透明度" }
settings.row.opacity.description:             { en: "How transparent the window's frosted base is; the chrome, the editor and the grid follow it.", zh-CN: "窗口毛玻璃底面的透明程度；界面、编辑器与表格都随之变化。" }
settings.row.color_titlebar.title:            { en: "Color the titlebar", zh-CN: "标题栏着色" }
settings.row.color_titlebar.description:      { en: "Paint the titlebar in the connection's color.", zh-CN: "用连接的颜色为标题栏上色。" }
settings.row.fonts.chrome.title:              { en: "Chrome", zh-CN: "界面" }
settings.row.fonts.chrome.description:        { en: "Sidebar, tabs, titlebar and status bar.", zh-CN: "边栏、标签页、标题栏与状态栏。" }
settings.row.fonts.editor.title:              { en: "Editor", zh-CN: "编辑器" }
settings.row.fonts.editor.description:        { en: "The query buffer and the other views that show code.", zh-CN: "查询缓冲区与其他显示代码的视图。" }
