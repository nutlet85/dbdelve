# rust-i18n v2 格式，同 vendor/gpui-component/locales/ui.yml。翻的是菜单层、
# 设置页、命令面板，以及写 DDL 的三个弹窗和 db/alter.rs 的拒绝句子。
# 占位符是 rust-i18n 的 `%{name}`。不翻服务器自己说的话，也不翻 SQL 关键字和
# 产品名：它们直接写死在代码里，不进这个文件。
