# —— 设置页：行标题与描述 ——
settings.row.row_limit.title:                 { en: "Row limit", zh-CN: "行数上限" }
settings.row.row_limit.description:           { en: "The most rows a new tab keeps from one statement. Tabs already open keep theirs.", zh-CN: "一个新标签页从单条语句保留的最多行数。已打开的标签页保持各自的上限。" }
settings.row.default_sorting.title:           { en: "Default sorting", zh-CN: "默认排序" }
settings.row.default_sorting.description:     { en: "How a new tab sorts on a header click. Server runs the query again, sorted by the database; Client reorders the rows already loaded, so a table sorts only the page on screen. Tabs already open keep theirs; each can be switched from its status bar.", zh-CN: "新标签页在表头点击时如何排序。服务器：重新向数据库请求排序后的结果；客户端：只重排已加载的行，因此表格只对屏幕上这一页排序。已打开的标签页保持各自的设置；可在各自的状态栏切换。" }
settings.row.language.title:                  { en: "Language", zh-CN: "语言" }
settings.row.language.description:            { en: "Interface language; takes effect immediately.", zh-CN: "界面语言；立即生效。" }
settings.row.qualify_completions.title:       { en: "Qualify table names", zh-CN: "表名带模式" }
settings.row.qualify_completions.description: { en: "Completing a table name inserts it with its schema, as schema.table.", zh-CN: "补全表名时连同模式一起插入，形如 schema.table。" }
settings.row.check_for_updates.title:         { en: "Check for updates", zh-CN: "检查更新" }
settings.row.check_for_updates.description:   { en: "One request to GitHub at launch to see whether a newer release exists. Nothing is sent about you or your databases.", zh-CN: "启动时向 GitHub 发一次请求，检查是否有新版本。不会发送关于你或你的数据库的任何信息。" }
settings.row.verbose_logging.title:           { en: "Verbose logging", zh-CN: "详细日志" }
settings.row.verbose_logging.description:     { en: "Adds hostnames, database names, connection errors (which can include the username) and database drivers' own messages to the log, from the moment it is switched on. Driver messages aren't filtered and can contain anything the server sends. Open Logs Folder in the Help menu shows the files.", zh-CN: "开启那一刻起，向日志追加主机名、数据库名、连接错误（可能包含用户名）以及数据库驱动自身的消息。驱动消息不经过滤，可能包含服务器发来的任何内容。帮助菜单里的打开日志文件夹可查看这些文件。" }
settings.row.match_system_appearance.title:   { en: "Match system appearance", zh-CN: "跟随系统外观" }
settings.row.match_system_appearance.description: { en: "Switch themes when the system turns light or dark.", zh-CN: "系统切换浅色或深色时切换主题。" }
settings.row.theme.title:                     { en: "Theme", zh-CN: "主题" }
settings.row.theme.description:               { en: "Moving through the list previews each theme.", zh-CN: "在列表中移动时会预览各个主题。" }
settings.row.dark_theme.title:                { en: "Dark theme", zh-CN: "深色主题" }
settings.row.dark_theme.description:          { en: "Used while the system is dark.", zh-CN: "系统处于深色时使用。" }
settings.row.light_theme.title:               { en: "Light theme", zh-CN: "浅色主题" }
settings.row.light_theme.description:         { en: "Used while the system is light.", zh-CN: "系统处于浅色时使用。" }
settings.row.opacity.title:                   { en: "Opacity", zh-CN: "透明度" }
settings.row.opacity.description:             { en: "Everything else is relative to this. The chrome, the editor and the results grid are tints over the frost set here, so they move with it rather than being set apiece.", zh-CN: "其余一切都相对此值。界面、编辑器与结果表格都是盖在毛玻璃上的色层，在这里设定，随它一起移动，而非各自为政。" }
settings.row.color_titlebar.title:            { en: "Color the titlebar", zh-CN: "标题栏着色" }
settings.row.color_titlebar.description:      { en: "Paint the titlebar in the connection's color.", zh-CN: "用连接的颜色为标题栏上色。" }
settings.row.fonts.chrome.title:              { en: "Chrome", zh-CN: "界面" }
settings.row.fonts.chrome.description:        { en: "Sidebar, tabs, titlebar and status bar.", zh-CN: "边栏、标签页、标题栏与状态栏。" }
settings.row.fonts.editor.title:              { en: "Editor", zh-CN: "编辑器" }
