name: release

# Run from the Actions tab. Unticked, it builds the Windows assets, signs them
# and publishes nothing -- the point is finding out whether they build and
# whether the signing key is the one the app trusts. Ticked, it tags the commit
# as v<Cargo.toml version> and publishes the release once every asset exists. A
# version with a hyphen (0.1.0-rc.1) is published as a pre-release and may come
# from any branch.
#
# Windows only, which is what this fork ships: the macOS and Linux jobs and the
# Homebrew cask job an upstream checkout carries are not here. Upstream's own
# release.yml is the place to look for those.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the release (unticked builds only)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      # Before any build, so a release that cannot go out fails in seconds
      # instead of after every asset has been built.
      - id: version
        run: |
          VERSION="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          PRERELEASE=false
          [[ "$VERSION" == *-* ]] && PRERELEASE=true
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          [[ "$PUBLISH" == true ]] || exit 0
          # An existing tag means Cargo.toml was not bumped since the last
          # release, and publishing would reuse a tag on a different commit.
          if [[ -n "$(git ls-remote --tags origin "refs/tags/v$VERSION")" ]]; then
            echo "v$VERSION is already tagged -- bump the version in Cargo.toml" >&2
            exit 1
          fi
          if [[ "$PRERELEASE" == false && "$GITHUB_REF" != refs/heads/main ]]; then
            echo "$VERSION is a stable version -- publish it from main" >&2
            exit 1
          fi
        env:
          PUBLISH: ${{ inputs.publish }}

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # The hosted image already has MSVC, the Windows SDK (GPUI's shaders)
      # and rc.exe (the icon resource). Inno Setup is only for wrapping the
      # staged tree into the installer; the app itself does not need it, so
      # it is not a README build dependency. The ODBC bridge builds here
      # against the system's odbc32, and is packaged without ever being run.
      - run: choco install innosetup --no-progress --yes
      - run: powershell -File dev/package-windows.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            target/windows/dbdelve-*.zip
            target/windows/dbdelve-*-setup.exe
          if-no-files-found: error

  # Its own job, and not gated on publishing, so an unticked run proves the
  # secret signs what the app will accept before a release depends on it.
  sign:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # Every asset gets a minisign signature beside it, `<asset>.minisig`,
      # which is what the app checks an update against before installing it.
      # UPDATE_SIGNING_KEY is an unencrypted minisign secret key; without it
      # nothing is published, since a release without signatures is one no
      # installed app will update to.
      - run: sudo apt-get update && sudo apt-get install -y minisign
      - run: |
          if [[ -z "$UPDATE_SIGNING_KEY" ]]; then
            echo "the UPDATE_SIGNING_KEY secret is not set -- releases must be signed" >&2
            exit 1
          fi
          # The key the app is built with, so a secret that does not match it
          # fails here instead of in every installed app.
          PUBLIC_KEY="$(sed -n 's/^const RELEASE_PUBLIC_KEY: &str = "\(.*\)";$/\1/p' src/update/download.rs)"
          # A fork starts with the placeholder in that constant, and a build
          # trusting no key is one nothing can update: paste the fork's own
          # public key into it (and into install.sh) before the first release.
          if [[ "$PUBLIC_KEY" == REPLACE_WITH_YOUR_FORKS_RELEASE_PUBLIC_KEY ]]; then
            echo "src/update/download.rs still holds the placeholder public key" >&2
            exit 1
          fi
          if ! grep -qxF "PUBLIC_KEY=\"$PUBLIC_KEY\"" install.sh; then
            echo "install.sh does not check downloads against the app's release key" >&2
            exit 1
          fi
          KEY="$RUNNER_TEMP/update.key"
          trap 'rm -f "$KEY"' EXIT
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$KEY"
          for ASSET in dist/*; do
            minisign -S -s "$KEY" -m "$ASSET" -x "$ASSET.minisig" < /dev/null
            # The app verifies prehashed signatures only (algorithm "ED");
            # a minisign old enough to make the legacy kind must fail here.
            if [[ "$(sed -n 2p "$ASSET.minisig" | base64 -d | head -c 2)" != ED ]]; then
              echo "$ASSET.minisig is not a prehashed signature" >&2
              exit 1
            fi
            # The app requires the trusted comment, which the signature covers,
            # to name the asset it downloaded: minisign's default
            # `file:<basename>` is what binds a signature to one release.
            if [[ "$(sed -n 3p "$ASSET.minisig")"$'\t' != *$'\t'"file:${ASSET##*/}"$'\t'* ]]; then
              echo "$ASSET.minisig does not name ${ASSET##*/} in its trusted comment" >&2
              exit 1
            fi
            minisign -V -q -P "$PUBLIC_KEY" -m "$ASSET" -x "$ASSET.minisig"
          done
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
      - uses: actions/upload-artifact@v7
        with:
          name: signatures
          path: dist/*.minisig
          if-no-files-found: error

  release:
    needs: [version, sign]
    if: inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # Every file the release is supposed to carry is named here, so a build
      # that quietly lost one fails before anything goes public rather than
      # publishing a release that is missing it.
      - run: |
          for ASSET in "dbdelve-$VERSION-windows-x86_64.zip" \
            "dbdelve-$VERSION-windows-x86_64-setup.exe"; do
            for FILE in "$ASSET" "$ASSET.minisig"; do
              if [[ ! -f "dist/$FILE" ]]; then
                echo "no $FILE among the built assets" >&2
                ls dist >&2
                exit 1
              fi
            done
          done
          PRERELEASE_FLAG=()
          [[ "$PRERELEASE" == true ]] && PRERELEASE_FLAG=(--prerelease)
          # --target creates the tag on the commit that was built. A tag made
          # with github.token starts no other workflow run.
          gh release create "v$VERSION" dist/* --target "$GITHUB_SHA" \
            --title "DBDelve $VERSION" --generate-notes "${PRERELEASE_FLAG[@]}" \
            --notes "Missing something? [Open an issue](https://github.com/nutlet85/dbdelve/issues).

          Windows only: the installer is unsigned, so SmartScreen warns once, and the zip is the portable build. The ODBC plugin ships untested."
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
